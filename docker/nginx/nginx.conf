worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Capability tokens fazem parte das URLs de playback. Nao registrar requests
  # impede que esses segredos de sessao vazem para stdout/collectors de logs.
  access_log off;
  error_log /dev/stderr warn;
  sendfile on;
  keepalive_timeout 30;

  upstream control_api { server control:7100; keepalive 16; }
  upstream torrent_data { server torrent-engine:7101; keepalive 16; }

  server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;

    location = /health { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    location = /_authorize {
      internal;
      proxy_pass http://control_api/internal/authorize;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $original_uri;
    }

    location ~ "^/stream/(?<session>[0-9a-f]{32})/(?<capability>[A-Za-z0-9_-]{32,128})/(?<storage>[0-9a-f]{64})/(?<asset>(?:[0-9]{3,4}p/)?[A-Za-z0-9_.-]+\.(?:m3u8|m4s|mp4|ts))$" {
      set $original_uri $request_uri;
      auth_request /_authorize;
      alias /hls/cache/$storage/$asset;
      add_header Cache-Control "private, no-store" always;
      add_header X-Content-Type-Options nosniff always;
      types { application/vnd.apple.mpegurl m3u8; video/mp4 mp4 m4s; video/mp2t ts; }
    }

    location ~ "^/source/[0-9a-f]{32}/[A-Za-z0-9_-]{32,128}$" {
      proxy_pass http://torrent_data;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 180s;
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;
    }

    location / {
      proxy_pass http://control_api;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
    }
  }
}
